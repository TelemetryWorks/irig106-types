version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Owner policy 2026-11-16: majors are planned in the coordinator's
    # planned-major-upgrades list; security updates are unaffected.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Keep the workflow SHA pins; Dependabot updates pins and version comments.
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Owner policy 2026-11-16: majors are planned in the coordinator's
    # planned-major-upgrades list; security updates are unaffected.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
